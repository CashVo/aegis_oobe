# File: aegis_config.yaml
# Purpose: Default config template. Values here are the lowest precedence.
#          Precedence: ENV (AEGIS_*) > YAML > Pydantic Defaults

project_name: "aegis"
version: "0.1.0"
log_level: "INFO" # CRITICAL, ERROR, WARNING, INFO, DEBUG

# Root directory for all persistent data, partitioned by tenant/user.
data_dir: "aegis_data"

# Redis connection for the message bus (CHUNK-002)
redis:
  host: "127.0.0.1"
  port: 6379
  db: 0

# API server configuration (for Janus agent, CHUNK-006)
api:
  host: "0.0.0.0"
  port: 8000

# Default timeout for agent request-response cycles.
agent_timeout_s: 30

# ──────────────────────────────────────────────────────────────────────
# Oracle Configuration (CHUNK-004 / CHUNK-013)
# ──────────────────────────────────────────────────────────────────────

oracle:
  # Maximum concurrent LLM requests across all providers
  max_concurrent_requests: 8

  # Default model preference (must match a key in 'models' below)
  # Using local qwen2.5-coder:7b as primary (fast, capable, local)
  default_model: "qwen2.5-coder:7b"

  # ── Provider Configuration ──
  providers:
    ollama:
      provider_type: "ollama"
      base_url: "http://localhost:11434"
      enabled: true
      timeout_seconds: 120
      max_concurrent: 4
      max_retries: 3

    openrouter:
      provider_type: "openrouter"
      base_url: "https://openrouter.ai/api/v1"
      api_key_env: "OPENROUTER_API_KEY"
      enabled: true  # Enabled for fallback when Ollama fails
      timeout_seconds: 60
      max_concurrent: 8
      max_retries: 3
      default_model: "nvidia/nemotron-3-ultra-550b-a55b:free"

  # ── Model Registry ──
  models:
    # OpenRouter cloud models (primary) - verified free models
    nemotron-3-ultra-550b:
      llm_id: "nvidia/nemotron-3-ultra-550b-a55b:free"
      provider: "openrouter"
      display_name: "Nemotron 3 Ultra 550B (OpenRouter Free)"
      context_window: 128000
      preference_tags: ["cloud", "capable", "complex", "default", "primary"]
      supports_json_mode: true
      supports_embeddings: false
      max_output_tokens: 4096

    nemotron-3.5-lightning:
      llm_id: "nvidia/nemotron-3.5-lightning:free"
      provider: "openrouter"
      display_name: "Nemotron 3.5 Lightning (OpenRouter Free)"
      context_window: 128000
      preference_tags: ["cloud", "fast", "fallback"]
      supports_json_mode: true
      supports_embeddings: false
      max_output_tokens: 4096

    nemotron-3-super-120b:
      llm_id: "nvidia/nemotron-3-super-120b-a12b:free"
      provider: "openrouter"
      display_name: "Nemotron 3 Super 120B A12B (OpenRouter Free)"
      context_window: 128000
      preference_tags: ["cloud", "capable", "complex", "fallback"]
      supports_json_mode: true
      supports_embeddings: false
      max_output_tokens: 4096

    gemma-4-31b-it:
      llm_id: "google/gemma-4-31b-it:free"
      provider: "openrouter"
      display_name: "Gemma 4 31B Instruct (OpenRouter Free)"
      context_window: 8192
      preference_tags: ["cloud", "capable", "complex", "gemini", "fallback"]
      supports_json_mode: true
      supports_embeddings: false
      max_output_tokens: 4096

    gemma-4-26b-a4b-it:
      llm_id: "google/gemma-4-26b-a4b-it:free"
      provider: "openrouter"
      display_name: "Gemma 4 26B A4B (OpenRouter Free)"
      context_window: 8192
      preference_tags: ["cloud", "capable", "complex", "gemini", "fallback"]
      supports_json_mode: true
      supports_embeddings: false
      max_output_tokens: 4096

    glm-5.2:
      llm_id: "z-ai/glm-5.2:free"
      provider: "openrouter"
      display_name: "GLM 5.2 (OpenRouter Free)"
      context_window: 32768
      preference_tags: ["cloud", "multilingual", "fallback"]
      supports_json_mode: true
      supports_embeddings: false
      max_output_tokens: 4096

    gpt-oss-20b:
      llm_id: "gpt-oss-20b:free"
      provider: "openrouter"
      display_name: "GPT-OSS 20B (OpenRouter Free)"
      context_window: 32768
      preference_tags: ["cloud", "fallback"]
      supports_json_mode: true
      supports_embeddings: false
      max_output_tokens: 4096

    # Local Ollama models (fallback when cloud fails)
    qwen2.5-coder:7b:
      llm_id: "qwen2.5-coder:7b"
      provider: "ollama"
      display_name: "Qwen 2.5 Coder 7B (Local)"
      context_window: 32768
      preference_tags: ["local", "fast", "capable", "default", "fallback"]
      supports_json_mode: true
      supports_embeddings: false
      max_output_tokens: 4096

    qwen3.5-9b:
      llm_id: "qwen3.5:9b"
      provider: "ollama"
      display_name: "Qwen 3.5 9B (Local)"
      context_window: 262144
      preference_tags: ["local", "fast", "capable", "fallback"]
      supports_json_mode: true
      supports_embeddings: false
      max_output_tokens: 4096

    qwen3.5-0.8b:
      llm_id: "qwen3.5:0.8b"
      provider: "ollama"
      display_name: "Qwen 3.5 0.8B (Local)"
      context_window: 262144
      preference_tags: ["local", "fast", "fallback"]
      supports_json_mode: true
      supports_embeddings: false
      max_output_tokens: 4096

  # ── Response Cache ──
  cache:
    enabled: true
    db_path: "aegis_data/oracle_cache.db"
    ttl_seconds: 3600
    max_entries: 10000

  # ── Rate Limiting ──
  rate_limit:
    enabled: true
    max_requests_per_minute: 30
    max_requests_per_hour: 500

  # ── Token Budget ──
  token_budget:
    tokens_per_word: 1.35
    safety_margin: 0.05

  # ── Request Timeout (seconds) ──
  request_timeout_seconds: 120

  # ── Fallback Order ──
  # Try providers in this order. First successful provider wins.
  # If all fail, request fails with error from last provider.
  fallback_order: ["ollama", "openrouter"]

  # ── Prompt Templates ──
  templates:
    default_system: "You are Aegis, an intelligent AI assistant. Be helpful, accurate, and concise."
    custom: {}

# System Manager configuration
system_manager:
  # Seconds between health check sweeps
  health_check_interval_seconds: 30
  # Max restart attempts before declaring agent failure
  restart_max_retries: 3
  # Exponential backoff base (seconds) for restarts
  restart_backoff_base_seconds: 2.0
  # Maximum backoff cap (seconds)
  restart_backoff_max_seconds: 60.0
  # Timeout for agent startup() calls
  startup_timeout_seconds: 30
  # Timeout for agent shutdown() calls
  shutdown_timeout_seconds: 15

# Scheduler configuration
scheduler:
  # Enable/disable the scheduler service
  enabled: true
  # Path to the SQLite job store database
  job_store_path: "aegis_data/scheduler_jobs.db"

# CLI / UI
web:
  enabled: true
  host: "0.0.0.0"
  port: 8420
  cors_origins:
    - "http://localhost:8420"
    - "http://207.211.172.66:8420"
    - "http://127.0.0.1:8420"
    - "http://192.168.1.1:8420"

mcp:
  enabled: true
  transport: "stdio"  # "stdio" or "sse"
  # sse_port: 8421   # Only used if transport is "sse"

cli:
  default_tenant: "default"
  default_user: "root"
  default_config: "aegis_config.yaml"

# Janus (API Gateway) configuration
janus:
  host: "127.0.0.1"
  port: 8000
  workers: 1
  cors_origins:
    - "http://localhost:8420"
    - "http://127.0.0.1:8420"

# Warden (Authorization) configuration
warden:
  enabled: true
  policy_path: "aegis_data/warden_policies.yaml"
  default_decision: "deny"

# Identity configuration
identity:
  enabled: true
  db_path: "aegis_data/identity.db"
  # Passphrase hashing rounds (higher = more secure, slower)
  argon2_iterations: 3
  argon2_memory_mb: 64
  argon2_parallelism: 4

# Observer configuration
observer:
  enabled: true
  db_path: "aegis_data/observer.db"
  retention_days: 30
  batch_size: 100
  flush_interval_seconds: 5
  health_host: "0.0.0.0"
  health_port: 8421

# Forge configuration
forge:
  enabled: true
  workspace_dir: "aegis_data/forge"
  max_concurrent_tasks: 4