    fast: llama3.2
    capable: llama3.2
    local: llama3.2
  defaults:
    temperature: 0.7
    max_tokens: 2000
    timeout_seconds: 60
embedding:
  provider: sentence-transformers
  model: all-MiniLM-L6-v2
  dimensions: 384
lexicon:
  data_dir: aegis_data
  l3_retention_days: 365
  l5_session_ttl_hours: 24
  context_default_token_budget: 4000
  promotion_check_interval_hours: 6
warden:
  shell_allowlist:
  - git *
  - ls *
  - cat *
  - echo *
  - mkdir *
  - find *
  - grep *
  - wc *
  - head *
  - tail *
