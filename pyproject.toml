# File: pyproject.toml
# Purpose: PEP 621 metadata, dependencies, and entry points for Aegis.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-system"
version = "0.1.0"
description = "A local-first, multi-agent AI system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Cash Vo", email = "cashvo@gmail.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Base = core runtime (CLI-friendly). Web + MCP are extras.
dependencies = [
  "pydantic>=2.11.0,<3.0.0",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "click==8.1.7",
  "typer>=0.9.0",
  "redis>=5.0",
  "apscheduler>=3.10",
  "aiosqlite>=0.19.0",
  "structlog>=24.1.0",
  "aiohttp>=3.9.0",
  "pyyaml>=6.0.1",
  "httpx>=0.27.0",
  "tiktoken>=0.7.0",  	# Optional: for accurate token counting (falls back to approximation)
  "aiofiles>=23.0",
  "rich",				# For console display with color and formatting
  #"jinja2>=3.1.4",
  #"python-multipart>=0.0.9",
  #"mcp>=1.0.0",	      	# MCP Server
  #"uv",					# python package and toolchain manager (helps manage dev env)
						# installer: curl -LsSf https://astral.sh/uv/install.sh | sh
]

[project.optional-dependencies]
# Local development tooling
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.9",
  #"httpx>=0.27.0",
]

# Web/API stack (only if you run the server)
web = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.13",
]

# MCP stack (only if you run the MCP server/client)
mcp = [
  "mcp>=1.27.0,<2.0",
]

[project.scripts]
aegis = "aegis.cli.main:main"
aegis-mcp = "aegis.mcp.server:main"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"


# How to run installation
#
# === In Ubuntu/Bash ===
#
# **Install uv first** `curl -LsSf https://astral.sh/uv/install.sh | sh`, then run
# uv venv .venv
# source .venv/bin/activate
# uv sync --extra dev --extra web --extra mcp
#
# === In PowerShell ===
#
# Dev (editable) + tooling: 
# pip install -e ".[dev]"
#
# Dev + web + mcp:  
# pip install -e ".[dev,web,mcp]"
#
# Upgrade installed packages:
# pip install --upgrade -e ".[dev,cli,web,mcp]"